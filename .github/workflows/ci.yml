name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  flutter:
    name: Flutter checks and web build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: asg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.6'
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: flutter test --no-pub --platform chrome test/browser_storage_test.dart test/browser_build_history_test.dart test/browser_archive_file_test.dart test/browser_generation_capability_test.dart
      - run: flutter build web --no-pub
      - name: Verify independent generated Flutter project
        run: flutter test --no-pub test/source_generation_test.dart --dart-define=ASG_REAL_GENERATION=true --plain-name 'real independent generated Flutter project'
  runtime:
    name: Python runtime fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: asg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -B tools/test_product_acceptance.py
      - run: python -B tools/test_download_model.py
      - run: python -B tools/test_qwen_streaming_server.py
      - run: python -B tools/test_generation_command.py
      - run: python -B tools/test_candidate_confinement.py
